name: InkBridge BOOX companion

on:
  push:
    branches: [master, "feat/**", "agent/**"]
    paths:
      - "boox-companion/**"
      - "inkbridge-boox-native/**"
      - "inkbridge-convert/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/inkbridge-boox-companion.yml"
  pull_request:
    paths:
      - "boox-companion/**"
      - "inkbridge-boox-native/**"
      - "inkbridge-convert/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/inkbridge-boox-companion.yml"

jobs:
  build-and-test:
    name: BOOX handoff tests + APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Configure Android NDK
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          test -n "$ndk" || { echo "::error::No Android NDK found on the runner"; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Build native BOOX converter
        run: |
          cargo ndk -t arm64-v8a \
            -o boox-companion/src/main/jniLibs \
            build --release -p inkbridge-boox-native --features jni-bridge
      - name: Test, lint, and assemble
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :boox-companion:testDebugUnitTest \
            :boox-companion:lintDebug \
            :boox-companion:assembleDebug \
            :boox-companion:assembleRelease \
            --console=plain
      - name: Verify native converter is packaged
        run: |
          apk="$(find boox-companion/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          listing="$(unzip -l "$apk")"
          [[ "$listing" == *"lib/arm64-v8a/libinkbridge_boox.so"* ]] || {
            echo "::error::Native BOOX converter missing from $apk"
            exit 1
          }
      - name: Verify automation actions are debug-only
        run: |
          debug_manifest=$(find boox-companion/build/intermediates/merged_manifests/debug -name AndroidManifest.xml -print -quit)
          release_manifest=$(find boox-companion/build/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)
          test -n "$debug_manifest"
          test -n "$release_manifest"
          grep -q 'dev.inkbridge.boox.action.INSTALL_NEXT' "$debug_manifest"
          if grep -q 'dev.inkbridge.boox.action.INSTALL_NEXT' "$release_manifest"; then
            echo "Release manifest exposes debug-only BOOX automation actions" >&2
            exit 1
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: inkbridge-boox-companion-debug-apk
          path: boox-companion/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
