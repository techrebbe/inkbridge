[package]
name = "inkbridge-cloud-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cloud Run, Cloud Storage, and Firestore adapters for the InkBridge broker"

[dependencies]
axum = "0.8"
base64 = "0.22"
inkbridge-broker.workspace = true
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
inkbridge-convert.workspace = true
lopdf.workspace = true
